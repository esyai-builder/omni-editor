[package]
name = "kvedit-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KVedit core timeline & project state engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
