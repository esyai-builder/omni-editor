[package]
name = "kvedit-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "KVedit Node native bindings via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.13", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.13"
kvedit-core = { path = "../kvedit-core" }
kvedit-media = { path = "../kvedit-media" }
kvedit-export = { path = "../kvedit-export" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
